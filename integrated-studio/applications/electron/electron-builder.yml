# 통합 작업실 — 개인 PC용 패키징(배포하지 않음, 서명 없음: SmartScreen 경고는 그대로 둔다)
appId: local.integrated-studio
productName: 통합 작업실
executableName: integrated-studio
copyright: 개인 사용 전용
electronDist: ../../node_modules/electron/dist
asar: false
# native 모듈은 theia rebuild:electron 으로 미리 재빌드한다(npm run rebuild:native)
npmRebuild: false
publish: null
directories:
  output: dist
  buildResources: resources
files:
  - lib/**
  - src-gen/**
  - scripts/**
  - plugins/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: ../../sidecar
    to: sidecar
    filter:
      - "**/*"
      - "!.venv/**"
      - "!**/__pycache__/**"
  # Python 포함판: CI가 build-python/ 에 임베디드 Python + 패키지를 넣는다. 비어 있으면 PC의 Python을 쓴다
  - from: ../../build-python
    to: python
    filter:
      - "**/*"
win:
  target:
    - target: nsis
  artifactName: IntegratedStudio-Setup-${version}.${ext}
nsis:
  # 기존 설치를 찾아 업데이트로 안내(resources/installer.nsh). 같은 appId라 같은 위치에 덮어쓴다
  include: resources/installer.nsh
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: 통합 작업실
linux:
  target:
    - target: dir
  category: Development
mac:
  target:
    - target: dir
