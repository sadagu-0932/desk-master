# 통합 작업실 — Windows 설치 파일 만들기 (개인 사용, 배포하지 않음)
# 요청할 때만 실행한다(Actions → "Run workflow"). push 로는 돌지 않는다.
# 결과: 실행 화면 아래 "Artifacts"의 IntegratedStudio-Setup (.exe, Python 미포함 — PC에 Python 3 필요)
# 버전은 0.1.<실행 번호>로 매번 올라가며, 이미 설치된 PC에서는 업데이트로 설치된다.
name: 통합 작업실 Windows 설치 파일

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-studio-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
    defaults:
      run:
        shell: pwsh
        working-directory: integrated-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrated-studio/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: '의존성 설치 (+ Open VSX 확장 - CommandCrafter, 한국어 팩)'
        run: npm ci

      - name: 함께 넣을 확장 확인
        run: |
          Get-ChildItem applications/electron/plugins | Select-Object Name
          if (-not (Test-Path applications/electron/plugins/Papierkorb2292.commandcrafter)) { throw 'CommandCrafter 확장을 받지 못했습니다' }

      - name: 사이드카 시험 (가짜 Modrinth·CurseForge 서버, 공식 런처 RPC, 설정 동기화)
        working-directory: integrated-studio/sidecar
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python tests/test_importers.py
          python tests/test_official_rpc.py
          python tests/test_sync.py
          python tests/test_cf_key.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_server_runner.py tests/test_modrinth.py tests/test_launchers.py tests/test_official_launcher.py tests/test_rpc_args.py tests/test_rpc_isolation.py mc_tools/tests

      - name: 앱 빌드
        run: npm run build

      - name: 서버 열기 시험 (가짜 공유기·playit·LAN 신호·상태 조회)
        run: npm test -w integrated-studio-server-host

      - name: native 모듈을 Electron용으로 재빌드
        run: npm run rebuild:native

      - name: Python 미포함 (빈 폴더)
        run: New-Item -ItemType Directory -Force build-python | Out-Null

      - name: 설치 파일 만들기
        working-directory: integrated-studio/applications/electron
        run: npx electron-builder --win nsis --publish never "-c.extraMetadata.version=$env:APP_VERSION"

      - name: 앱이 켜지는지 확인
        run: node scripts/ci-smoke.mjs "applications/electron/dist/win-unpacked/integrated-studio.exe"

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: IntegratedStudio-Setup-${{ env.APP_VERSION }}
          path: integrated-studio/applications/electron/dist/*.exe
          if-no-files-found: error
          retention-days: 30
